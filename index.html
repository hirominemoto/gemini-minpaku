<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1F FLOOR PLAN - 360° Interactive 3D Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Noto Sans JP', sans-serif;
            background: radial-gradient(circle at center, #fdfbf7 0%, #e8dec8 100%);
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.5s ease;
        }
        body.night-mode {
            background: radial-gradient(circle at center, #1b2234 0%, #0b0f19 100%);
        }
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .title-serif {
            font-family: 'Playfair Display', 'Noto Sans JP', serif;
        }
        /* Floating 3D Room Labels */
        .room-label {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 15;
        }
        .room-label:hover {
            transform: translate(-50%, -58%) scale(1.08);
            z-index: 25;
        }
        .label-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(160, 130, 95, 0.4);
            box-shadow: 0 3px 10px rgba(40, 25, 10, 0.15);
            border-radius: 8px;
            padding: 3px 8px;
            text-align: center;
            white-space: nowrap;
        }
        body.night-mode .label-card {
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(251, 191, 36, 0.4);
        }
        body.night-mode .label-jp {
            color: #fef3c7;
        }
        body.night-mode .label-en {
            color: #cbd5e1;
        }
        .label-card.highlight {
            background: linear-gradient(135deg, #fffbeb 0%, #fde68a 100%);
            border: 2px solid #d97706;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.35);
        }
        body.night-mode .label-card.highlight {
            background: linear-gradient(135deg, #78350f 0%, #b45309 100%);
            border-color: #fbbf24;
        }
        .label-jp {
            font-size: 11px;
            font-weight: 700;
            color: #292524;
            line-height: 1.2;
        }
        .label-en {
            font-size: 9px;
            font-weight: 500;
            color: #78716c;
            line-height: 1.1;
        }
        /* Active button styling */
        .mode-btn-active {
            background: #f59e0b !important;
            color: #ffffff !important;
            border-color: #d97706 !important;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }
        /* Menu transition */
        #full-menu-deck {
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
        }
        #full-menu-deck.menu-hidden {
            transform: translateY(-130%);
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- =========================================================================
         MINI FLOATING BAR (SHOWN WHEN MAIN MENU IS HIDDEN)
         ========================================================================= -->
    <div id="mini-menu-bar" class="fixed top-2.5 left-1/2 -translate-x-1/2 z-40 hidden pointer-events-auto">
        <div class="bg-white/90 backdrop-blur-md border border-stone-300 shadow-lg rounded-full px-3 py-1.5 flex items-center gap-2">
            <button onclick="toggleMenuDeck(true)" class="px-3 py-1 rounded-full text-xs font-bold bg-stone-800 text-white hover:bg-stone-700 transition flex items-center gap-1 shadow-sm">
                <span>⚙️ 操作メニューを表示</span>
                <span>🔽</span>
            </button>
            <button onclick="cycleWallHeight()" id="mini-wall-btn" class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-900 border border-amber-300 hover:bg-amber-200 transition">
                🧱 壁: 標準
            </button>
            <button onclick="toggleNightMode()" id="mini-night-btn" class="px-2.5 py-1 rounded-full text-xs font-bold bg-indigo-900 text-white hover:bg-indigo-800 transition">
                🌙 照明
            </button>
        </div>
    </div>

    <!-- =========================================================================
         TOP CONTROL DECK (COLLAPSIBLE SO IT NEVER BLOCKS THE ROOM)
         ========================================================================= -->
    <div id="full-menu-deck" class="fixed top-2 left-2 right-2 z-30 pointer-events-none flex flex-col items-center gap-1.5">
        
        <!-- Row 1: Title + Primary Prominent Switches + Hide Menu Button -->
        <div class="w-full max-w-5xl bg-white/95 backdrop-blur-md border border-stone-300/90 shadow-lg rounded-2xl px-3 py-2 pointer-events-auto flex flex-wrap items-center justify-between gap-2">
            
            <!-- Title & Operation Hint -->
            <div class="flex items-center gap-2">
                <span class="title-serif font-bold text-sm sm:text-lg text-stone-800 tracking-wide">1F FLOOR PLAN</span>
                <span
