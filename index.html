<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1F FLOOR PLAN - 360° Interactive 3D Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Noto Sans JP', sans-serif;
            background: radial-gradient(circle at center, #fdfbf7 0%, #e8dec8 100%);
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.5s ease;
        }
        body.night-mode {
            background: radial-gradient(circle at center, #1b2234 0%, #0b0f19 100%);
        }
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .title-serif {
            font-family: 'Playfair Display', 'Noto Sans JP', serif;
        }
        /* Floating 3D Room Labels */
        .room-label {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 15;
        }
        .room-label:hover {
            transform: translate(-50%, -58%) scale(1.08);
            z-index: 25;
        }
        .label-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(160, 130, 95, 0.4);
            box-shadow: 0 3px 10px rgba(40, 25, 10, 0.15);
            border-radius: 8px;
            padding: 3px 8px;
            text-align: center;
            white-space: nowrap;
        }
        body.night-mode .label-card {
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(251, 191, 36, 0.4);
        }
        body.night-mode .label-jp {
            color: #fef3c7;
        }
        body.night-mode .label-en {
            color: #cbd5e1;
        }
        .label-card.highlight {
            background: linear-gradient(135deg, #fffbeb 0%, #fde68a 100%);
            border: 2px solid #d97706;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.35);
        }
        body.night-mode .label-card.highlight {
            background: linear-gradient(135deg, #78350f 0%, #b45309 100%);
            border-color: #fbbf24;
        }
        .label-jp {
            font-size: 11px;
            font-weight: 700;
            color: #292524;
            line-height: 1.2;
        }
        .label-en {
            font-size: 9px;
            font-weight: 500;
            color: #78716c;
            line-height: 1.1;
        }
        /* Active button styling */
        .mode-btn-active {
            background: #f59e0b !important;
            color: #ffffff !important;
            border-color: #d97706 !important;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }
        /* Smooth Collapsible Control Panel */
        #control-panel-body {
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease, transform 0.3s ease;
            max-height: 320px;
            opacity: 1;
            transform: translateY(0);
            overflow: hidden;
        }
        #control-panel-body.collapsed {
            max-height: 0;
            opacity: 0;
            transform: translateY(-12px);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- =========================================================================
         COLLAPSIBLE TOP CONTROL DECK (CAN BE HIDDEN SO ROOM IS NEVER BLOCKED!)
         ========================================================================= -->
    <div class="fixed top-2 left-2 right-2 z-30 pointer-events-none flex flex-col items-center">
        
        <!-- Collapsible Main Panel -->
        <div id="control-panel-body" class="w-full max-w-5xl flex flex-col items-center gap-1.5 pointer-events-auto">
            
            <!-- Row 1: Title + Primary Prominent Switches + Hide Button -->
            <div class="w-full bg-white/95 backdrop-blur-md border border-stone-300/90 shadow-lg rounded-2xl px-3 py-2 flex flex-wrap items-center justify-between gap-2">
                
                <!-- Title & Operation Hint -->
                <div class="flex items-center gap-2">
                    <span class="title-serif font-bold text-sm sm:text-lg text-stone-800 tracking-wide">1F FLOOR PLAN</span>
                    <span class="text-[10px] sm:text-xs font-bold text-amber-800 bg-amber-100 border border-amber-300 px-2 py-0.5 rounded-full">360° 3D</span>
                    <span class="hidden xl:inline-block text-[11px] text-stone-500 ml-1">（ドラッグで回転・ホイール/ピンチで拡大）</span>
                </div>

                <!-- Main Feature Switches (Super Prominent!) -->
                <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
                    
                    <!-- 1. Wall Height Switcher -->
                    <div class="flex items-center bg-stone-100 p-1 rounded-xl border border-stone-200">
                        <span class="text-[11px] font-bold text-stone-700 px-1.5 flex items-center gap-1">🧱 壁の高さ:</span>
                        <button id="wall-full" onclick="setWallHeightMode('full')" class="px-2 py-1 rounded-lg text-[11px] font-bold transition mode-btn-active">
                            標準
                        </button>
                        <button id="wall-low" onclick="setWallHeightMode('low')" class="px-2 py-1 rounded-lg text-[11px] font-bold text-stone-700 hover:bg-stone-200 transition">
                            低くする (見やすい!)
                        </button>
                        <button id="wall-ultra" onclick="setWallHeightMode('ultra')" class="px-2 py-1 rounded-lg text-[11px] font-bold text-stone-700 hover:bg-stone-200 transition">
                            極低
                        </button>
                    </div>

                    <!-- 2. Cozy Night Lighting Mode Toggle -->
                    <button id="btn-night" onclick="toggleNightMode()" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-gradient-to-r from-indigo-600 to-slate-800 text-white hover:from-indigo-700 hover:to-slate-900 shadow-md transition flex items-center gap-1.5 ring-2 ring-indigo-300">
                        <span id="night-icon">🌙</span>
                        <span id="night-text">夜くつろぎ照明: OFF</span>
                    </button>

                    <!-- 3. Labels & Spin Toggles -->
                    <button id="btn-labels" onclick="toggleLabels()" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-stone-100 text-stone-700 border border-stone-300 hover:bg-stone-200 transition">
                        🏷️ 文字: ON
                    </button>
                    <button id="btn-spin" onclick="toggleAutoSpin()" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-stone-100 text-stone-700 border border-stone-300 hover:bg-stone-200 transition">
                        🔄 自動回転
                    </button>

                    <!-- 4. Collapse / Hide Panel Button -->
                    <button onclick="toggleControlPanel(false)" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100 transition flex items-center gap-1 shadow-sm" title="操作バーを隠して画面を広く使う">
                        <span>🔼</span>
                        <span>メニューを隠す</span>
                    </button>
                </div>
            </div>

            <!-- Row 2: Camera Quick-Jump Preset Buttons -->
            <div class="w-full bg-white/90 backdrop-blur-md border border-stone-200 shadow-md rounded-xl px-2.5 py-1.5 flex flex-wrap items-center justify-center gap-1.5">
                <span class="text-[11px] font-bold text-stone-500 mr-1">📷 視点ジャンプ:</span>
                
                <button onclick="focusCamera('overview')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-stone-800 text-white hover:bg-stone-700 transition">
                    🏠 全体 (斜め)
                </button>
                <button onclick="focusCamera('laundry')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-amber-500 text-white hover:bg-amber-600 shadow-sm ring-1 ring-amber-300 transition">
                    🧺 脱衣場・洗濯機＆シャワーを拡大
                </button>
                <button onclick="focusCamera('washroom')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-stone-100 text-stone-700 hover:bg-stone-200 border border-stone-200 transition">
                    🚰 洗面所・トイレ
                </button>
                <button onclick="focusCamera('living')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-stone-100 text-stone-700 hover:bg-stone-200 border border-stone-200 transition">
                    🛋️ リビング＆キッチン
                </button>
                <button onclick="focusCamera('bedsLeft')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-stone-100 text-stone-700 hover:bg-stone-200 border border-stone-200 transition">
                    🛏️ ベッド 1・2・3
                </button>
                <button onclick="focusCamera('bedsRight')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-stone-100 text-stone-700 hover:bg-stone-200 border border-stone-200 transition">
                    🛌 ベッド 4・5
                </button>
                <button onclick="focusCamera('topdown')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-stone-100 text-stone-700 hover:bg-stone-200 border border-stone-200 transition">
                    📐 真上から (平面図比較)
                </button>
            </div>
        </div>

        <!-- Compact Floating Pill Button (Shown only when the main control bar is hidden!) -->
        <div id="control-panel-minimized" class="hidden pointer-events-auto mt-0.5">
            <div class="bg-white/90 backdrop-blur-md border border-stone-300 shadow-lg rounded-full px-2 py-1 flex items-center gap-1.5">
                <button onclick="toggleControlPanel(true)" class="px-3 py-1 rounded-full text-xs font-bold bg-stone-800 text-white hover:bg-stone-700 transition flex items-center gap-1.5 shadow-sm">
                    <span>⚙️</span>
                    <span>操作メニューを表示</span>
                    <span class="text-[10px] opacity-80">🔽</span>
                </button>
                <button onclick="setWallHeightMode(currentWallMode === 'full' ? 'low' : 'full')" id="mini-wall-btn" class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-stone-100 text-stone-700 hover:bg-stone-200 border border-stone-200 transition" title="壁の高さを切り替え">
                    🧱 壁切替
                </button>
                <button onclick="toggleNightMode()" id="mini-night-btn" class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-indigo-50 text-indigo-800 hover:bg-indigo-100 border border-indigo-200 transition" title="夜くつろぎ照明を切り替え">
                    🌙 照明
                </button>
            </div>
        </div>

    </div>

    <!-- 3D Room Labels Overlay Container -->
    <div id="labels-container" class="fixed inset-0 pointer-events-none overflow-hidden z-20"></div>

    <!-- WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <script>
        // ============================================================================
        // 1. SCENE, CAMERA, RENDERER & ORBIT CONTROLS
        // ============================================================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 200);
        camera.position.set(0, 28, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI / 2 - 0.02; // Prevent camera going below floor
        controls.minDistance = 4;
        controls.maxDistance = 58;
        controls.target.set(0, 0.2, -1.2);

        // Camera smooth animation state
        let camAnim = null;
        function animateCameraTo(targetPos, targetLookAt, duration = 900) {
            controls.autoRotate = false;
            updateSpinButtonUI();
            camAnim = {
                startPos: camera.position.clone(),
                endPos: new THREE.Vector3(...targetPos),
                startLook: controls.target.clone(),
                endLook: new THREE.Vector3(...targetLookAt),
                startTime: performance.now(),
                duration: duration
            };
        }

        // Camera Presets
        window.focusCamera = function(preset) {
            switch(preset) {
                case 'overview':
                    animateCameraTo([0, 28, 25], [0, 0.2, -1.2]);
                    break;
                case 'laundry':
                    // Automatically lower walls slightly if full so user gets an unobstructed view of the washing machine & shower!
                    if (currentWallMode === 'full') setWallHeightMode('low');
                    animateCameraTo([2.4, 7.8, -2.5], [6.2, 0.9, -9.2]);
                    break;
                case 'washroom':
                    animateCameraTo([-1.5, 9.2, -1.8], [-1.5, 0.9, -9.8]);
                    break;
                case 'living':
                    animateCameraTo([-1.8, 12.5, 18.2], [1.2, 0.8, 7.2]);
                    break;
                case 'bedsLeft':
                    animateCameraTo([2.2, 11.5, 2.2], [-6.8, 0.8, -2.5]);
                    break;
                case 'bedsRight':
                    animateCameraTo([-2.2, 11.5, 2.0], [6.5, 0.8, -1.5]);
                    break;
                case 'topdown':
                    animateCameraTo([0, 36, 0.01], [0, 0, -1.0]);
                    break;
            }
        };

        // ============================================================================
        // 2. PROCEDURAL TEXTURES & MATERIALS
        // ============================================================================
        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e5be90';
            ctx.fillRect(0, 0, 512, 512);

            const plankH = 64;
            for (let y = 0; y < 512; y += plankH) {
                const offset = (y / plankH) % 2 === 0 ? 0 : 128;
                for (let x = -128; x < 512; x += 256) {
                    const shade = (Math.random() - 0.5) * 14;
                    ctx.fillStyle = `rgb(${228 + shade}, ${188 + shade}, ${140 + shade})`;
                    ctx.fillRect(x + offset, y, 256, plankH);
                    ctx.strokeStyle = 'rgba(140, 95, 50, 0.22)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x + offset, y, 256, plankH);

                    ctx.fillStyle = 'rgba(160, 110, 60, 0.07)';
                    for (let g = 0; g < 6; g++) {
                        ctx.fillRect(x + offset + 10, y + Math.random() * (plankH - 4), 230, 1.5);
                    }
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 7);
            return tex;
        }

        function createTileTexture(bgHex, lineHex, repeatX, repeatY) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgHex;
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = lineHex;
            ctx.lineWidth = 4;
            for (let i = 0; i <= 256; i += 64) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(repeatX, repeatY);
            return tex;
        }

        const woodTex = createWoodTexture();
        const beigeTileTex = createTileTexture('#efe6d8', '#d8cbb8', 3, 3);
        const showerTileTex = createTileTexture('#cbd5e1', '#94a3b8', 2.5, 3.5);
        const laundryFloorTex = createTileTexture('#f5ebe0', '#dfd2c5', 2.5, 3);

        const lampShadeMaterials = []; // Tracked for Night Mode glow

        const mats = {
            woodFloor: new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.55, metalness: 0.05 }),
            beigeTile: new THREE.MeshStandardMaterial({ map: beigeTileTex, roughness: 0.4, metalness: 0.05 }),
            showerTile: new THREE.MeshStandardMaterial({ map: showerTileTex, roughness: 0.3, metalness: 0.1 }),
            laundryTile: new THREE.MeshStandardMaterial({ map: laundryFloorTex, roughness: 0.45, metalness: 0.05 }),
            wallBody: new THREE.MeshStandardMaterial({ color: 0xf7f2eb, roughness: 0.75 }),
            wallCap: new THREE.MeshStandardMaterial({ color: 0x6b7075, roughness: 0.5 }),
            baseboard: new THREE.MeshStandardMaterial({ color: 0xc89d6c, roughness: 0.6 }),
            doorWood: new THREE.MeshStandardMaterial({ color: 0xc68b45, roughness: 0.5 }),
            oakWood: new THREE.MeshStandardMaterial({ color: 0xd4a36a, roughness: 0.5 }),
            darkWood: new THREE.MeshStandardMaterial({ color: 0x8c5a2b, roughness: 0.55 }),
            whiteCeramic: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15, metalness: 0.1 }),
            chrome: new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.15, metalness: 0.85 }),
            darkMetal: new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.3, metalness: 0.7 }),
            glass: new THREE.MeshPhysicalMaterial({
                color: 0xdbeafe,
                transparent: true,
                opacity: 0.36,
                roughness: 0.05,
                metalness: 0.1,
                side: THREE.DoubleSide
            }),
            sofaCream: new THREE.MeshStandardMaterial({ color: 0xf5f2eb, roughness: 0.85 }),
            rugBeige: new THREE.MeshStandardMaterial({ color: 0xdfd3c3, roughness: 0.95 }),
            plantGreen: new THREE.MeshStandardMaterial({ color: 0x4d7c43, roughness: 0.7 }),
            plantPot: new THREE.MeshStandardMaterial({ color: 0xc29b70, roughness: 0.6 })
        };

        // ============================================================================
        // 3. LIGHTING (DAYTIME & WARM COZY NIGHT MODE)
        // ============================================================================
        const ambientLight = new THREE.AmbientLight(0xfff8ed, 0.74);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xfffdf9, 0xe6ccb2, 0.45);
        hemiLight.position.set(0, 30, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e4, 0.88);
        dirLight.position.set(14, 28, 18);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 5;
        dirLight.shadow.camera.far = 65;
        const d = 16;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // Warm interior point lights
        const roomPointLights = [];
        function addWarmLight(x, y, z, baseIntensity = 0.4, nightIntensity = 1.35, distance = 9.5) {
            const pl = new THREE.PointLight(0xffb35c, baseIntensity, distance);
            pl.position.set(x, y, z);
            pl.userData = { baseIntensity, nightIntensity };
            scene.add(pl);
            roomPointLights.push(pl);
            return pl;
        }
        addWarmLight(-0.8, 2.8, 7.6, 0.45, 1.5, 12);   // Living Room Center
        addWarmLight(6.5, 2.8, 6.5, 0.4, 1.25, 10);    // Kitchen
        addWarmLight(-1.0, 2.8, -10.0, 0.4, 1.25, 9);  // Washroom
        addWarmLight(5.4, 2.8, -9.2, 0.55, 1.5, 9.5);  // Dressing & Laundry Room (Highlight)
        addWarmLight(-7.0, 2.2, -5.8, 0.35, 1.2, 7.5); // Bed 3
        addWarmLight(-7.0, 2.2, -2.8, 0.35, 1.2, 7.5); // Bed 2
        addWarmLight(-7.0, 2.2, 1.0, 0.35, 1.2, 7.5);  // Bed 1
        addWarmLight(6.5, 2.2, -3.5, 0.4, 1.3, 8.5);   // Bed 5
        addWarmLight(6.5, 2.2, 1.4, 0.4, 1.3, 8.5);    // Bed 4

        // ============================================================================
        // 4. ARCHITECTURAL BASE, FLOORS & HEIGHT-ADJUSTABLE WALLS
        // ============================================================================
        const houseGroup = new THREE.Group();
        scene.add(houseGroup);

        function makeBox(w, h, d, mat, x, y, z, castShadow = true, receiveShadow = true) {
            const geom = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = castShadow;
            mesh.receiveShadow = receiveShadow;
            houseGroup.add(mesh);
            return mesh;
        }

        // Base Plinth Slab (Matching exact 1F footprint with bottom-right cutout)
        makeBox(20.4, 0.7, 22.4, mats.wallBody, 0, -0.35, -1.0, false, true);
        makeBox(14.4, 0.7, 2.0, mats.wallBody, -3.0, -0.35, 11.2, false, true);

        // Main Wood Flooring
        makeBox(19.8, 0.04, 21.8, mats.woodFloor, 0, 0.02, -1.0, false, true);
        makeBox(14.0, 0.04, 2.0, mats.woodFloor, -3.0, 0.02, 11.0, false, true);

        // Zone-specific Floor Overlays
        makeBox(2.8, 0.05, 4.0, mats.beigeTile, -5.2, 0.03, -10.0, false, true);    // Toilet
        makeBox(7.3, 0.05, 4.0, mats.beigeTile, -0.15, 0.03, -10.0, false, true);   // Washroom
        makeBox(3.7, 0.05, 5.5, mats.laundryTile, 5.35, 0.03, -9.25, false, true);  // Dressing & Laundry Room
        makeBox(2.6, 0.05, 5.5, mats.showerTile, 8.5, 0.03, -9.25, false, true);    // Shower Room
        makeBox(2.8, 0.05, 8.8, mats.beigeTile, -5.8, 0.03, 7.6, false, true);      // Entrance Genkan

        // --- WALLS & DOORS WITH DYNAMIC HEIGHT SCALING ---
        const WALL_H = 2.55;
        const wallObjects = []; // Store walls for smooth height transitions
        const doorPanels = [];  // Store doors so they scale down with walls
        const wallMountedItems = []; // High shelves that hide when walls are ultra-low

        function buildWall(x1, z1, x2, z2, thickness = 0.24) {
            const dx = x2 - x1;
            const dz = z2 - z1;
            const len = Math.hypot(dx, dz);
            const cx = (x1 + x2) / 2;
            const cz = (z1 + z2) / 2;
            const angle = Math.atan2(dz, dx);

            const group = new THREE.Group();
            group.position.set(cx, 0, cz);
            group.rotation.y = -angle;

            // Main wall body
            const body = new THREE.Mesh(new THREE.BoxGeometry(len, WALL_H, thickness), mats.wallBody);
            body.position.y = WALL_H / 2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Top dark grey cap
            const cap = new THREE.Mesh(new THREE.BoxGeometry(len + 0.02, 0.09, thickness + 0.04), mats.wallCap);
            cap.position.y = WALL_H + 0.045;
            group.add(cap);

            // Wooden baseboard
            const base = new THREE.Mesh(new THREE.BoxGeometry(len + 0.01, 0.12, thickness + 0.03), mats.baseboard);
            base.position.y = 0.06;
            group.add(base);

            houseGroup.add(group);
            wallObjects.push({ body, cap });
        }

        // Outer Perimeter Walls

            { jp: '階段', en: 'Stairs', pos: new THREE.Vector3(-8.6, 2.0, 7.2), preset: 'overview' },
            { jp: '玄関', en: 'Entrance', pos: new THREE.Vector3(-5.8, 1.5, 6.5), preset: 'overview' },
            { jp: 'リビング', en: 'Living Room', pos: new THREE.Vector3(-0.8, 1.4, 7.7), preset: 'living' },
            { jp: 'キッチン', en: 'Kitchen', pos: new THREE.Vector3(6.5, 1.4, 6.5), preset: 'living' }
        ];

        roomLabelsData.forEach(item => {
            const el = document.createElement('div');
            el.className = 'room-label';
            el.innerHTML = `
                <div class="label-card ${item.highlight ? 'highlight' : ''}">
                    <div class="label-jp">${item.jp}</div>
                    <div class="label-en">${item.en}</div>
                </div>
            `;
            el.onclick = () => focusCamera(item.preset);
            labelsContainer.appendChild(el);
            item.element = el;
        });

        function updateLabelsProjection() {
            if (!labelsVisible) return;
            const halfW = window.innerWidth / 2;
            const halfH = window.innerHeight / 2;

            roomLabelsData.forEach(item => {
                const v = item.pos.clone().project(camera);
                if (v.z > 1) {
                    item.element.style.opacity = '0';
                    item.element.style.pointerEvents = 'none';
                } else {
                    const x = (v.x * halfW) + halfW;
                    const y = -(v.y * halfH) + halfH;
                    item.element.style.left = `${x}px`;
                    item.element.style.top = `${y}px`;
                    item.element.style.opacity = '1';
                    item.element.style.pointerEvents = 'auto';
                }
            });
        }

        // ============================================================================
        // 7. WALL HEIGHT MODE & COZY NIGHT MODE CONTROLS
        // ============================================================================
        window.toggleControlPanel = function(show) {
            const panelBody = document.getElementById('control-panel-body');
            const minBar = document.getElementById('control-panel-minimized');
            if (show) {
                panelBody.classList.remove('collapsed');
                minBar.classList.add('hidden');
            } else {
                panelBody.classList.add('collapsed');
                setTimeout(() => {
                    if (panelBody.classList.contains('collapsed')) {
                        minBar.classList.remove('hidden');
                    }
                }, 220);
            }
        };

        let currentWallMode = 'full';
        let targetWallScale = 1.0;
        let currentWallScale = 1.0;

        window.setWallHeightMode = function(mode) {
            currentWallMode = mode;
            document.getElementById('wall-full').classList.toggle('mode-btn-active', mode === 'full');
            document.getElementById('wall-low').classList.toggle('mode-btn-active', mode === 'low');
            document.getElementById('wall-ultra').classList.toggle('mode-btn-active', mode === 'ultra');

            if (mode === 'full') {
                targetWallScale = 1.0;
                wallMountedItems.forEach(g => g.visible = true);
            } else if (mode === 'low') {
                targetWallScale = 0.35; // ~0.9m height so washing machine & beds are clearly visible!
                wallMountedItems.forEach(g => g.visible = true);
            } else if (mode === 'ultra') {
                targetWallScale = 0.10; // ~0.25m floorplan section height
                wallMountedItems.forEach(g => g.visible = false);
            }
        };

        let isNightMode = false;
        window.toggleNightMode = function() {
            isNightMode = !isNightMode;
            document.body.classList.toggle('night-mode', isNightMode);
            const btn = document.getElementById('btn-night');
            const iconEl = document.getElementById('night-icon');
            const textEl = document.getElementById('night-text');

            if (isNightMode) {
                ambientLight.intensity = 0.22;
                hemiLight.intensity = 0.18;
                dirLight.intensity = 0.20;
                roomPointLights.forEach(pl => pl.intensity = pl.userData.nightIntensity);
                lampShadeMaterials.forEach(m => m.emissiveIntensity = 1.6);
                iconEl.textContent = '☀️';
                textEl.textContent = '夜くつろぎ照明: ON';
                btn.classList.remove('from-indigo-600', 'to-slate-800');
                btn.classList.add('from-amber-500', 'to-orange-600', 'ring-amber-300');
            } else {
                ambientLight.intensity = 0.74;
                hemiLight.intensity = 0.45;
                dirLight.intensity = 0.88;
                roomPointLights.forEach(pl => pl.intensity = pl.userData.baseIntensity);
                lampShadeMaterials.forEach(m => m.emissiveIntensity = 0.55);
                iconEl.textContent = '🌙';
                textEl.textContent = '夜くつろぎ照明: OFF';
                btn.classList.add('from-indigo-600', 'to-slate-800');
                btn.classList.remove('from-amber-500', 'to-orange-600', 'ring-amber-300');
            }
        };

        window.toggleLabels = function() {
            labelsVisible = !labelsVisible;
            labelsContainer.style.display = labelsVisible ? 'block' : 'none';
            document.getElementById('btn-labels').innerHTML = `🏷️ 文字: ${labelsVisible ? 'ON' : 'OFF'}`;
        };

        window.toggleAutoSpin = function() {
            controls.autoRotate = !controls.autoRotate;
            controls.autoRotateSpeed = 1.5;
            updateSpinButtonUI();
        };

        function updateSpinButtonUI() {
            const btn = document.getElementById('btn-spin');
            if (controls.autoRotate) {
                btn.classList.add('mode-btn-active');
            } else {
                btn.classList.remove('mode-btn-active');
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================================
        // 8. RENDER & SMOOTH ANIMATION LOOP
        // ============================================================================
        function animate(now) {
            requestAnimationFrame(animate);

            // Smooth camera transitions
            if (camAnim) {
                const elapsed = now - camAnim.startTime;
                const t = Math.min(elapsed / camAnim.duration, 1);
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

                camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
                controls.target.lerpVectors(camAnim.startLook, camAnim.endLook, ease);

                if (t >= 1) camAnim = null;
            }

            // Smooth wall height animation
            if (Math.abs(currentWallScale - targetWallScale) > 0.002) {
                currentWallScale += (targetWallScale - currentWallScale) * 0.14;
                const h = WALL_H * currentWallScale;
                wallObjects.forEach(w => {
                    w.body.scale.y = currentWallScale;
                    w.body.position.y = h / 2;
                    w.cap.position.y = h + 0.045;
                });
                doorPanels.forEach(d => {
                    d.scale.y = currentWallScale;
                });
            }

            controls.update();
            renderer.render(scene, camera);
            updateLabelsProjection();
        }

        window.onload = function() {
            animate(performance.now());
        };
    </script>
</body>
</html>
